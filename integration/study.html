<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自习室查询 - 校园公共信息与数据展示中心</title>
  <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ 统一导航栏（四个模块入口） ============ -->
  <nav class="navbar navbar-expand-lg campus-navbar sticky-top" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 9 12 4 2 9l10 5 10-5Z"></path>
          <path d="M6 11.5V16c0 1.2 2.7 3 6 3s6-1.8 6-3v-4.5"></path>
        </svg>
        <span>校园信息展示中心</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">首页</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="study.html">自习室</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="stats.html">统计</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="three-d/scene.html">校园三维</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ============ 页面标题 ============ -->
  <header class="page-banner">
    <div class="container">
      <h1>自习室查询</h1>
    </div>
  </header>

  <main class="container my-4">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">首页</a></li>
        <li class="breadcrumb-item active" aria-current="page">自习室查询</li>
      </ol>
    </nav>

    <!-- ============ 筛选区（楼层 / 开放状态，选择后即时过滤） ============ -->
    <section class="card border-0 shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">筛选条件</h2>
        <div class="row g-3 align-items-end">
          <div class="col-12 col-sm-6 col-lg-3">
            <label for="floorFilter" class="form-label">楼层</label>
            <select id="floorFilter" class="form-select">
              <option value="all">全部楼层</option>
              <option value="1">1 楼</option>
              <option value="2">2 楼</option>
              <option value="3">3 楼</option>
              <option value="4">4 楼</option>
            </select>
          </div>
          <div class="col-12 col-sm-6 col-lg-3">
            <label for="statusFilter" class="form-label">开放状态</label>
            <select id="statusFilter" class="form-select">
              <option value="all">全部状态</option>
              <option value="open">开放中</option>
              <option value="closed">已关闭</option>
            </select>
          </div>
          <div class="col-12 col-lg-3">
            <button id="resetFilter" type="button" class="btn btn-outline-campus w-100">重置筛选</button>
          </div>
          <div class="col-12 col-lg-3 text-lg-end">
            <span id="resultCount" class="text-muted small"></span>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ 自习室列表（由 js/study.js 渲染） ============ -->
    <section id="roomList" class="row g-3" aria-live="polite"></section>
  </main>

  <!-- ============ 页脚 ============ -->
  <footer class="campus-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span>迷你版校园公共信息与数据展示中心 · integration 整合练习</span>
      <a href="index.html">返回首页</a>
    </div>
  </footer>

  <script src="lib/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="js/study.js"></script>
</body>
</html>
