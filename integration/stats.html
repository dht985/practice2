<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>使用统计 - 校园公共信息与数据展示中心</title>
  <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ 统一导航栏（四个模块入口） ============ -->
  <nav class="navbar navbar-expand-lg campus-navbar sticky-top" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <svg class="brand-logo" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M22 9 12 4 2 9l10 5 10-5Z"></path>
          <path d="M6 11.5V16c0 1.2 2.7 3 6 3s6-1.8 6-3v-4.5"></path>
        </svg>
        <span>校园信息展示中心</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
              aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="index.html">首页</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="study.html">自习室</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="stats.html">统计</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="three-d/scene.html">校园三维</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ============ 页面标题 ============ -->
  <header class="page-banner">
    <div class="container">
      <h1>使用统计图表</h1>
    </div>
  </header>

  <main class="container my-4">
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html">首页</a></li>
        <li class="breadcrumb-item active" aria-current="page">使用统计</li>
      </ol>
    </nav>

    <!-- 状态提示：加载中 / 加载失败 / 空数据（复用课堂六状态模式） -->
    <div id="chartStatus" class="alert d-none" role="alert"></div>

    <!-- ============ 各自习室使用量柱状图 ============ -->
    <section class="card border-0 shadow-sm">
      <div class="card-body">
        <h2 class="h5">各自习室使用量柱状图</h2>
        <p class="text-muted small mb-3" id="metaNote">正在读取 data.json…</p>
        <div id="usageChart" class="chart-box" style="height: 420px;"></div>
        <p class="text-muted small mt-3 mb-0">
          说明：图表通过 fetch 加载本地 <code>data/data.json</code> 渲染；标题、单位（人次）与数据来源均标注在图内副标题中。
        </p>
      </div>
    </section>
  </main>

  <!-- ============ 页脚 ============ -->
  <footer class="campus-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span>迷你版校园公共信息与数据展示中心 · integration 整合练习</span>
      <a href="index.html">返回首页</a>
    </div>
  </footer>

  <script src="lib/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="lib/echarts/echarts.min.js"></script>
  <script src="js/stats.js"></script>
</body>
</html>
